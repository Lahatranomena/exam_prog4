openapi: 3.0.3
info:
  title: Submission API
  description: API pour soumettre une image avec un email, et lister les soumissions enregistrées.
  version: 1.0.0
paths:
  /submissions:
    post:
      summary: Soumettre une image avec un email
      operationId: submitImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - file
              properties:
                email:
                  type: string
                  format: email
                  example: test@example.com
                file:
                  type: string
                  format: binary
                  description: Image au format JPEG ou PNG
      responses:
        '200':
          description: Soumission créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: Requête invalide (email ou fichier manquant, type de fichier non supporté)
    get:
      summary: Lister toutes les soumissions
      operationId: getAllSubmissions
      responses:
        '200':
          description: Liste de toutes les soumissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
components:
  schemas:
    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        fileName:
          type: string
          example: image.png
        email:
          type: string
          format: email
          example: test@example.com
        createdAt:
          type: string
          format: date-time
          example: '2026-07-13T05:42:51.916Z'